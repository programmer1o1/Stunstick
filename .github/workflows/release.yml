name: Release (experimental)

on:
  push:
    tags:
      - "v*"
      - "experimental*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pack:
    name: Build & package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Stunstick.CrossPlatform.sln

      - name: Test
        run: dotnet test Stunstick.CrossPlatform.sln -c Release --no-restore

      - name: Build bundled StudioMDL and vphysics on macOS
        if: runner.os == 'macOS'
        run: bash scripts/toolchain/build_studiomdl.sh

      - name: Publish (CLI + Desktop + SteamPipe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          $rid = "${{ matrix.rid }}"
          $versionTag = $tag
          if ($versionTag.StartsWith("v")) { $versionTag = $versionTag.Substring(1) }
          $versionBase = $versionTag.Split("-")[0]
          $parts = $versionBase.Split(".")
          while ($parts.Length -lt 4) { $parts += "0" }
          if ($parts.Length -gt 4) { $parts = $parts[0..3] }
          $assemblyVersion = ($parts -join ".")
          $versionArgs = @(
            "/p:Version=$versionTag",
            "/p:InformationalVersion=$versionTag",
            "/p:AssemblyVersion=$assemblyVersion",
            "/p:FileVersion=$assemblyVersion"
          )

          New-Item -ItemType Directory -Force out | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force staging | Out-Null

          dotnet publish src/Stunstick.Cli -c Release -r $rid --self-contained false -o out/cli @versionArgs
          dotnet publish src/Stunstick.Desktop -c Release -r $rid --self-contained false -o out/desktop @versionArgs
          dotnet publish src/Stunstick.SteamPipe -c Release -r $rid --self-contained false -o out/steampipe @versionArgs

          # SteamPipe helper must be next to the CLI/Desktop executables for Workshop features.
          Copy-Item -Force -Recurse out/steampipe/* out/cli/
          Copy-Item -Force -Recurse out/steampipe/* out/desktop/

          # Help resources (local fallback before opening GitHub URLs).
          Copy-Item -Force README.md, CROSS_PLATFORM.md, parity.md, FAQ.md, LICENSE.txt out/desktop/
          New-Item -ItemType Directory -Force out/desktop/docs/images, out/desktop/tools/studiomdl | Out-Null
          Copy-Item -Force docs/images/* out/desktop/docs/images/
          Copy-Item -Force tools/studiomdl/README.md out/desktop/tools/studiomdl/

          $root = "staging/Stunstick-$tag-$rid"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null

          Copy-Item -Force -Recurse out/cli $root/
          Copy-Item -Force -Recurse out/desktop $root/

          $zipPath = "dist/Stunstick-$tag-$rid.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          if ($IsMacOS) {
            foreach ($app in @("cli", "desktop")) {
              $toolDir = "$root/$app/tools/studiomdl/bin"
              foreach ($file in @("studiomdl", "libvphysics.dylib", "vphysics-LICENSE.txt")) {
                if (-not (Test-Path "$toolDir/$file" -PathType Leaf)) { throw "Missing $toolDir/$file" }
              }
              & /bin/test -x "$toolDir/studiomdl"
              if ($LASTEXITCODE -ne 0) { throw "StudioMDL is not executable in $app" }
              & /usr/bin/lipo "$toolDir/studiomdl" -verify_arch x86_64
              if ($LASTEXITCODE -ne 0) { throw "Invalid StudioMDL architecture in $app" }
              & /usr/bin/lipo "$toolDir/libvphysics.dylib" -verify_arch x86_64
              if ($LASTEXITCODE -ne 0) { throw "Invalid vphysics architecture in $app" }
            }
            & /usr/bin/ditto -c -k --keepParent $root $zipPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create the macOS release archive" }
          } else {
            Compress-Archive -Path $root -DestinationPath $zipPath
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stunstick-${{ matrix.rid }}
          path: dist/*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-pack
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: stunstick-*
          merge-multiple: true

      - name: Create prerelease (experimental)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
